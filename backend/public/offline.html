<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Tidak ada koneksi</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f5f5f4; color: #1c1917; text-align: center; padding: 24px; }
        @media (prefers-color-scheme: dark) { body { background: #111827; color: #f5f5f4; } }
        main { max-width: 22rem; }
        h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1.25rem; opacity: .8; line-height: 1.5; }
        button { font: inherit; padding: .65rem 1.4rem; border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Tidak ada koneksi</h1>
        <p>Periksa sinyal atau jaringan Anda, lalu coba lagi. Formulir yang belum dikirim tidak hilang selama halaman ini belum ditutup.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
