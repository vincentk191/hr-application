# Security headers, sent on every response. Not a template: it has no ${...} placeholders, only nginx's own $variables,
# so the Dockerfile copies it straight in.
#
# Include it in each server block AND in every location that sets an add_header of its own: nginx drops all the headers
# it would inherit from the level above as soon as a location adds even one, so a location that does not include this
# file goes out without any of them.
#
# $hsts_value is set by each including server block: "max-age=..." where the connection is https, empty where it is not
# (nginx leaves out a header whose value is empty, and a browser ignores HSTS over plain http anyway).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# Nothing in the app is meant to be shown inside another page, so a hidden frame cannot be laid over the approve buttons.
add_header X-Frame-Options "DENY" always;
# Only the directives that cannot break the app's own scripts and styles. A full script/style policy needs the Inertia,
# Livewire and Filament inline pieces mapped out first, and belongs in Content-Security-Policy-Report-Only until it has been.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security $hsts_value always;
