# The routes every entrance shares (the plain-HTTP server block in nginx.conf.template, and the TLS block for
# WireGuard peers). Not a template: it has no ${...} placeholders, only nginx's own $variables, so the Dockerfile
# copies it straight in rather than through envsubst. Each including server block must `set $https_flag` first
# (the forwarded value behind the host's proxy, or "on" for a connection this Nginx terminates itself).

# The service worker must be revalidated every time, and may control the whole site.
location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
}

# Built files have a hash in their name.
location /build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Docker's own resolver, and a variable, so Nginx looks `app` up again instead of keeping the address it had when it
# started: the app container gets a new address whenever it is recreated, and a fixed one gives a 502 until Nginx restarts.
resolver 127.0.0.11 valid=10s;

location = /index.php {
    include fastcgi_params;
    set $php_upstream app:9000;
    fastcgi_pass $php_upstream;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param ENTRANCE $entrance;
    fastcgi_param HTTPS $https_flag;
    # The app's pages send long response headers (the Link preload hints for the built assets, and cookies). The
    # default buffer is 4k or 8k, and a header that does not fit is a 502 ("upstream sent too big header").
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 32k;
    fastcgi_read_timeout 60s;
}

# Nothing else is run as PHP, and dot files are never served.
location ~ \.php$ { return 404; }
location ~ /\.(?!well-known) { deny all; }
