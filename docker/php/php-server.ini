; Server overrides: nothing is shown to the browser, and files are not re-checked on every request.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 30M
max_execution_time = 60

; No X-Powered-By header telling a visitor which PHP version to look up exploits for.
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

opcache.enable = 1
opcache.enable_cli = 1
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.validate_timestamps = 0

realpath_cache_size = 4M
realpath_cache_ttl = 600
