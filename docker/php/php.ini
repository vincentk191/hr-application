; Development overrides. Production gets its own file when Phase 7 lands.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120

; Errors belong in the terminal in dev, not swallowed.
display_errors = On
error_reporting = E_ALL

; --- Opcache -----------------------------------------------------------------------------
; enable_cli is the important one: `artisan serve` runs on the PHP CLI server, so with
; enable_cli=0 opcache is off for every single request and the whole framework is recompiled
; each time. Over a Windows bind mount that turns a trivial request into seconds.
opcache.enable = 1
opcache.enable_cli = 1

; Laravel plus vendor/ is well past the 10000 default; exceeding it makes opcache evict and
; recompile constantly.
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; Keep picking up edits to bind-mounted files, but stat each file at most once every 2s
; instead of on every request. The 2s staleness is not noticeable while editing.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Laravel resolves a lot of paths; a generous realpath cache avoids repeated stat calls on a
; filesystem where each one is expensive.
realpath_cache_size = 8M
realpath_cache_ttl = 300
