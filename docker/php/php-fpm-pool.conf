; Server pool overrides, loaded after the image's www.conf (php-fpm.d/*.conf is read in name order).
; Sized for 100-150 employees on a shared VPS: a handful of workers in the quiet hours, up to 12 at a busy moment
; (each uses roughly 50-80 MB), and every worker is replaced after 500 requests so none lives long.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
